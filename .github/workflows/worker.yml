name: Worker

# Started by the app (Convex projects.startWorker) with the project's id. Plans the project, waits
# for the owner's approval in the app, then builds it in its own repo, streaming progress to Convex.
on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Project id from the app (Convex)"
        required: true

permissions:
  contents: read

concurrency:
  group: paid-run            # one build at a time while all projects share one scratch repo
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q claude-agent-sdk daytona pytest
      - name: Check the id looks like a Convex id
        env:
          PROJECT_ID: ${{ inputs.project_id }}
        run: echo "$PROJECT_ID" | grep -Eq '^[a-z0-9]{16,40}$' || { echo "bad project id"; exit 1; }
      - name: Plan, wait for approval, build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          PROJECTS_GITHUB_TOKEN: ${{ secrets.PROJECTS_GITHUB_TOKEN }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          PROJECT_ID: ${{ inputs.project_id }}
        run: |
          git config --global user.email "engine@agents.local"
          git config --global user.name "engine"
          python worker.py --project-id "$PROJECT_ID" --budget 0.50
      - name: Delete any sandboxes this run left behind
        if: always()
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        run: python scripts/daytona_cleanup.py delete-engine
      - name: Save the event log and built code
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-results
          path: results/
          if-no-files-found: ignore
